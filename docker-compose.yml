name: orders-platform

x-app: &app
  image: laravel-orders-platform/app:dev
  environment: &app-env
    APP_NAME: "Orders Platform"
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_KEY: ${APP_KEY:-base64:Q2hhbmdlTWVJblByb2R1Y3Rpb25QbGVhc2VPcmRlcnM=}
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_FAKER_LOCALE: pt_BR
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: orders
    DB_USERNAME: orders
    DB_PASSWORD: secret
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    MESSAGING_DRIVER: rabbitmq
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: orders
    RABBITMQ_PASSWORD: secret
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
      target: dev
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/status SCRIPT_FILENAME=/status REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    image: laravel-orders-platform/web:dev
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 10s
      timeout: 5s
      retries: 10

  test:
    <<: *app
    profiles: ["test"]
    environment:
      <<: *app-env
      APP_ENV: testing
      DB_DATABASE: orders_testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MESSAGING_DRIVER: log
    command: ["php", "artisan", "test"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_FORWARD_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: orders
      RABBITMQ_DEFAULT_PASS: secret
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
